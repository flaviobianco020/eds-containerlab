# multi_hop.clab.yml
#
# "multi hop" topology of the Event-Driven Simulator project.
# Reproduces NetworkTopology.multi_hop() (n_hops=3): a linear chain of 4 nodes.
#
#   n0 ══(10 Mbps)══ n1 ══(10 Mbps)══ n2 ══(10 Mbps)══ n3
#
# Every link is 10 Mbps (sim: capacity=10). The intermediate nodes n1 and n2
# forward the packets. Addresses, routing and shaping are applied by
# ../deploy.sh.
name: multi-hop

topology:
  defaults:
    kind: linux
    binds:
      # emulator agent (UDP traffic generator) available at /opt/eds
      - ../agent:/opt/eds:ro
  kinds:
    linux:
      image: ghcr.io/srl-labs/network-multitool:latest
  nodes:
    n0: {}
    n1: {}
    n2: {}
    n3: {}
  links:
    - endpoints: ["n0:eth1", "n1:eth1"]
    - endpoints: ["n1:eth2", "n2:eth1"]
    - endpoints: ["n2:eth2", "n3:eth1"]
