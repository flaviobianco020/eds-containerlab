# single_bottleneck.clab.yml
#
# "single bottleneck" topology of the Event-Driven Simulator project.
# Reproduces NetworkTopology.single_bottleneck() with 3 sources (used by
# scenarios 5 and 6 of examples/scenarios.py):
#
#   src0 ──┐
#   src1 ──┼── router ════(bottleneck 10 Mbps)════ dst
#   src2 ──┘
#
# The access links src*->router are high-capacity (sim: capacity=1000),
# the router->dst link is the bottleneck (sim: capacity=10, queue_size=20).
# Addresses, routing and shaping (tc) are applied by ../deploy.sh.
name: single-bottleneck

topology:
  defaults:
    kind: linux
    binds:
      # emulator agent (UDP traffic generator) available at /opt/eds
      - ../agent:/opt/eds:ro
  kinds:
    linux:
      image: ghcr.io/srl-labs/network-multitool:latest
  nodes:
    src0: {}
    src1: {}
    src2: {}
    router: {}
    dst: {}
  links:
    # high-capacity access links
    - endpoints: ["src0:eth1", "router:eth1"]
    - endpoints: ["src1:eth1", "router:eth2"]
    - endpoints: ["src2:eth1", "router:eth3"]
    # bottleneck
    - endpoints: ["router:eth4", "dst:eth1"]
